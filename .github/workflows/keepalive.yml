name: Keep Render app awake

# Le palier gratuit Render met le service en veille après 15 min sans
# trafic (redémarrage ~1 min à la première visite suivante). Ce ping le
# maintient éveillé -- gratuit et illimité ici car le dépôt est public
# (minutes GitHub Actions illimitées sur dépôt public, contrairement à
# un cron Render qui n'a pas de palier gratuit malgré ce qu'indiquait
# l'outil de création -- vérifié par un vrai appel qui l'a refusé).

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping l'app Render
        run: curl -sf -o /dev/null https://trieur-data.onrender.com/ || true
